# Render blueprint for Zoomly (free tier).
# In Render: New -> Blueprint -> connect the repo containing this file.
services:
  - type: web
    name: zoomly
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false # set in Render dashboard, e.g. libsql://your-db.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false # set in Render dashboard (secret)
      - key: ADMIN_USERNAME
        sync: false # set in Render dashboard — the owner account's username
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # set in Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false # set in Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false # set in Render dashboard (secret)
      - key: GOOGLE_CLIENT_ID
        sync: false # optional — Google sign-in (see README "Google sign-in")
      - key: GOOGLE_CLIENT_SECRET
        sync: false # optional — Google sign-in (secret)
      - key: ADSENSE_CLIENT_ID
        sync: false # optional — AdSense (owner decision 2026-10-24); unset = no ad, no script, no layout change
      - key: ADSENSE_AD_SLOT
        sync: false # optional — AdSense responsive ad-unit slot; unset = no ad unit rendered
      - key: MONETAG_TAG_URL
        sync: false # optional — Monetag MultiTag script URL (owner decision 2026-10-24); unset = no script loaded, nothing changes
      - key: NODE_VERSION
        value: "22.23.4" # patched per Render security advisory 2026-10-24 (Node.js TLS/eMudhra fixes); was "20"
